<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>Sin conexión · Waterpolo Pro</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #f8fafc; color: #0f172a; font-family: ui-sans-serif, system-ui, sans-serif; }
      main { width: min(100%, 480px); padding: 32px; text-align: center; background: white; border: 1px solid #e2e8f0; border-radius: 20px; box-shadow: 0 16px 50px rgb(15 23 42 / 10%); }
      img { width: 88px; height: 88px; object-fit: contain; }
      h1 { margin: 18px 0 8px; font-size: clamp(1.5rem, 5vw, 2rem); }
      p { margin: 0; color: #475569; line-height: 1.6; }
      button { margin-top: 24px; min-height: 44px; padding: 0 22px; border: 0; border-radius: 10px; background: #0f172a; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa-icon-192.png" alt="" />
      <h1>Sin conexión</h1>
      <p>No se puede acceder al torneo ahora mismo. Recupera la conexión y vuelve a intentarlo.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
